version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: atamasta_db
    environment:
      POSTGRES_USER: atamasta_user
      POSTGRES_PASSWORD: securepassword
      POSTGRES_DB: atamasta_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atamasta_user -d atamasta_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: atamasta_backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://atamasta_user:securepassword@db:5432/atamasta_db
      SECRET_KEY: change-this-in-production-at-least-32-characters
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      ADMIN_EMAIL: admin@atamasta.com
      ADMIN_PASSWORD: Admin@12345
      CORS_ORIGINS: "http://localhost:3000,http://localhost:8080,http://127.0.0.1:5500,http://localhost:5500"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    restart: unless-stopped

volumes:
  postgres_data:
