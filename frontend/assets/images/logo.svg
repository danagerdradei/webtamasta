  <use href="#gk" transform="rotate(340 100 100)"/>
  <use href="#gk" transform="rotate(350 100 100)"/>

  <!-- ── Border circles ── -->
  <circle cx="100" cy="100" r="98"   fill="none" stroke="#d4a017" stroke-width="1.5"/>
  <circle cx="100" cy="100" r="82"   fill="none" stroke="#d4a017" stroke-width="1"/>
  <!-- Solid inner background (covers meander inside) -->
  <circle cx="100" cy="100" r="81.5" fill="#090909"/>

  <!-- ══ WARRIOR SILHOUETTE (profile facing LEFT) ══ -->
  <path fill="#d4a017" d="
    M 115,39
    L 118,45  L 122,55  L 124,65  L 124,75
    L 123,85  L 122,95  L 120,105 L 118,115
    L 114,125 L 108,133 L 100,137 L 90,133
    L 84,125  L 83,118  L 81,110
    L 79,106  L 75,102  L 76,99
    L 78,97   L 74,94   L 71,90
    L 75,86   L 79,82   L 83,78
    L 86,73   L 87,67   L 88,61
    L 88,51   L 88,41
    L 91,37   L 95,39   L 100,36
    L 104,39  L 109,40  L 112,38
    Z
  "/>

  <!-- ── Headband ── -->
  <rect x="87" y="70" width="38" height="8" rx="2" fill="#d4a017"/>
  <rect x="87" y="72" width="38" height="3" rx="1" fill="#a07010"/>

  <!-- ── Ear ornament ── -->
  <circle cx="92" cy="91" r="5.5" fill="#d4a017"/>
  <circle cx="92" cy="91" r="3"   fill="#090909"/>

  <!-- ── ATAMASTA label ── -->
  <text
    x="100" y="158"
    text-anchor="middle"
