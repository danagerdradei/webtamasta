  <use href="#gk" transform="rotate(70  100 100)"/>
  <use href="#gk" transform="rotate(80  100 100)"/>
  <use href="#gk" transform="rotate(90  100 100)"/>
  <use href="#gk" transform="rotate(100 100 100)"/>
  <use href="#gk" transform="rotate(110 100 100)"/>
  <use href="#gk" transform="rotate(120 100 100)"/>
  <use href="#gk" transform="rotate(130 100 100)"/>
  <use href="#gk" transform="rotate(140 100 100)"/>
  <use href="#gk" transform="rotate(150 100 100)"/>
  <use href="#gk" transform="rotate(160 100 100)"/>
