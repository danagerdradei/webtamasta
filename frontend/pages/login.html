<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar sesión — Atamasta</title>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="../css/main.css" />
</head>
<body>

<div id="toast-container" class="toast-container"></div>

<nav class="navbar scrolled" id="navbar">
  <div class="container">
    <a href="../index.html" class="nav-logo">ATA<span>MASTA</span></a>
    <div class="nav-auth" id="nav-auth"></div>
  </div>
</nav>

<div class="auth-page">
  <div class="container">
    <div class="auth-card fade-in">
      <div class="auth-logo">
        <h1>ATA<span>MASTA</span></h1>
        <p>Inicia sesión para acceder al contenido exclusivo</p>
      </div>

      <div id="auth-alert"></div>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label class="form-label">Correo electrónico</label>
          <input type="email" class="form-input" id="email" placeholder="tu@email.com" required autocomplete="email" />
        </div>
        <div class="form-group">
          <label class="form-label">Contraseña</label>
          <div style="position:relative;">
            <input type="password" class="form-input" id="password" placeholder="••••••••" required autocomplete="current-password" style="padding-right:3rem;" />
            <button type="button" id="toggle-pass" style="position:absolute;right:0.75rem;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text-muted);cursor:pointer;">
              <i class="fas fa-eye"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary" style="width:100%; margin-top:0.5rem;" id="submit-btn">
          <i class="fas fa-sign-in-alt"></i> Iniciar sesión
        </button>
      </form>

      <p style="text-align:center; margin-top:1.5rem; color:var(--text-muted); font-size:0.9rem;">
        ¿No tienes cuenta? <a href="register.html">Regístrate gratis</a>
      </p>
      <p style="text-align:center; margin-top:0.5rem;">
        <a href="../index.html" style="color:var(--text-muted); font-size:0.85rem;">
          <i class="fas fa-arrow-left"></i> Volver al inicio
        </a>
      </p>
    </div>
  </div>
</div>

<script src="../js/api.js"></script>
<script src="../js/utils.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  updateNavAuth();

  // Redirect if already logged in
  const user = getUser();
  if (user) { window.location.href = user.role === 'admin' ? 'admin.html' : '../index.html'; return; }

  const form = document.getElementById('login-form');
  const alertEl = document.getElementById('auth-alert');
  const btn = document.getElementById('submit-btn');

  document.getElementById('toggle-pass').addEventListener('click', () => {
    const inp = document.getElementById('password');
    const icon = document.querySelector('#toggle-pass i');
    if (inp.type === 'password') { inp.type = 'text'; icon.className = 'fas fa-eye-slash'; }
    else { inp.type = 'password'; icon.className = 'fas fa-eye'; }
  });

  form.addEventListener('submit', async e => {
    e.preventDefault();
    alertEl.innerHTML = '';
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    if (!email || !password) {
      alertEl.innerHTML = '<div class="alert alert-error">Completa todos los campos.</div>';
      return;
    }

    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Ingresando...';

    try {
      const res = await api.login({ email, password });
      setToken(res.access_token);
      setUser(res.user);
      toast('Bienvenido de vuelta, ' + res.user.username + '!', 'success');
      setTimeout(() => {
        window.location.href = res.user.role === 'admin' ? 'admin.html' : '../index.html';
      }, 800);
    } catch (err) {
      alertEl.innerHTML = `<div class="alert alert-error"><i class="fas fa-times-circle"></i> ${err.message}</div>`;
      btn.disabled = false;
      btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Iniciar sesión';
    }
  });
});
</script>
</body>
</html>
