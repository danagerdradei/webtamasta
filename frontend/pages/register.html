<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registrarse — Atamasta</title>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="../css/main.css" />
</head>
<body>

<div id="toast-container" class="toast-container"></div>

<nav class="navbar scrolled">
  <div class="container">
    <a href="../index.html" class="nav-logo">ATA<span>MASTA</span></a>
    <div class="nav-auth" id="nav-auth"></div>
  </div>
</nav>

<div class="auth-page">
  <div class="container">
    <div class="auth-card fade-in">
      <div class="auth-logo">
        <h1>ATA<span>MASTA</span></h1>
        <p>Crea tu cuenta gratis y accede a contenido exclusivo</p>
      </div>

      <!-- Benefits -->
      <div style="background:var(--bg3); border:1px solid var(--border); border-radius:var(--radius); padding:1rem; margin-bottom:1.5rem;">
        <div style="color:var(--gold); font-size:0.8rem; font-weight:600; text-transform:uppercase; letter-spacing:0.1em; margin-bottom:0.75rem;">Beneficios de registrarse</div>
        <ul style="list-style:none; color:var(--text-muted); font-size:0.85rem; display:flex; flex-direction:column; gap:0.4rem;">
          <li><i class="fas fa-check" style="color:var(--gold); margin-right:0.5rem;"></i>Acceso a discografía completa</li>
          <li><i class="fas fa-check" style="color:var(--gold); margin-right:0.5rem;"></i>Reproductor de música integrado</li>
          <li><i class="fas fa-check" style="color:var(--gold); margin-right:0.5rem;"></i>Novedades y contenido exclusivo</li>
        </ul>
      </div>

      <div id="auth-alert"></div>

      <form id="register-form" novalidate>
        <div class="form-group">
          <label class="form-label">Nombre de usuario</label>
          <input type="text" class="form-input" id="username" placeholder="goldenfingaz_fan" required autocomplete="username" />
          <div class="form-error" id="username-err" style="display:none;"></div>
        </div>
        <div class="form-group">
          <label class="form-label">Correo electrónico</label>
          <input type="email" class="form-input" id="email" placeholder="tu@email.com" required autocomplete="email" />
        </div>
        <div class="form-group">
          <label class="form-label">Contraseña</label>
          <div style="position:relative;">
            <input type="password" class="form-input" id="password" placeholder="Mínimo 8 caracteres" required autocomplete="new-password" style="padding-right:3rem;" />
            <button type="button" id="toggle-pass" style="position:absolute;right:0.75rem;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text-muted);cursor:pointer;">
              <i class="fas fa-eye"></i>
            </button>
          </div>
          <div class="form-error" id="pass-err" style="display:none;"></div>
        </div>
        <div class="form-group">
          <label class="form-label">Confirmar contraseña</label>
          <input type="password" class="form-input" id="password2" placeholder="Repite la contraseña" required autocomplete="new-password" />
        </div>

        <button type="submit" class="btn btn-primary" style="width:100%; margin-top:0.5rem;" id="submit-btn">
          <i class="fas fa-user-plus"></i> Crear cuenta
        </button>
      </form>

      <p style="text-align:center; margin-top:1.5rem; color:var(--text-muted); font-size:0.9rem;">
        ¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a>
      </p>
      <p style="text-align:center; margin-top:0.5rem;">
        <a href="../index.html" style="color:var(--text-muted); font-size:0.85rem;">
          <i class="fas fa-arrow-left"></i> Volver al inicio
        </a>
      </p>
    </div>
  </div>
</div>

<script src="../js/api.js"></script>
<script src="../js/utils.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  updateNavAuth();
  if (getUser()) { window.location.href = '../index.html'; return; }

  const form = document.getElementById('register-form');
  const alertEl = document.getElementById('auth-alert');
  const btn = document.getElementById('submit-btn');

  document.getElementById('toggle-pass').addEventListener('click', () => {
    const inp = document.getElementById('password');
    const icon = document.querySelector('#toggle-pass i');
    if (inp.type === 'password') { inp.type = 'text'; icon.className = 'fas fa-eye-slash'; }
    else { inp.type = 'password'; icon.className = 'fas fa-eye'; }
  });

  // Live username validation
  document.getElementById('username').addEventListener('input', function() {
    const err = document.getElementById('username-err');
    const val = this.value.trim();
    if (val && (val.length < 3 || val.length > 50)) {
      err.style.display = 'flex';
      err.innerHTML = '<i class="fas fa-exclamation-circle"></i> 3-50 caracteres';
    } else { err.style.display = 'none'; }
  });

  // Live password validation
  document.getElementById('password').addEventListener('input', function() {
    const err = document.getElementById('pass-err');
    if (this.value && this.value.length < 8) {
      err.style.display = 'flex';
      err.innerHTML = '<i class="fas fa-exclamation-circle"></i> Mínimo 8 caracteres';
    } else { err.style.display = 'none'; }
  });

  form.addEventListener('submit', async e => {
    e.preventDefault();
    alertEl.innerHTML = '';

    const username = document.getElementById('username').value.trim();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const password2 = document.getElementById('password2').value;

    if (!username || !email || !password || !password2) {
      alertEl.innerHTML = '<div class="alert alert-error">Completa todos los campos.</div>';
      return;
    }
    if (password !== password2) {
      alertEl.innerHTML = '<div class="alert alert-error">Las contraseñas no coinciden.</div>';
      return;
    }
    if (password.length < 8) {
      alertEl.innerHTML = '<div class="alert alert-error">La contraseña debe tener al menos 8 caracteres.</div>';
      return;
    }

    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Creando cuenta...';

    try {
      const res = await api.register({ username, email, password });
      setToken(res.access_token);
      setUser(res.user);
      toast('¡Bienvenido, ' + res.user.username + '!', 'success');
      setTimeout(() => { window.location.href = '../index.html'; }, 900);
    } catch (err) {
      alertEl.innerHTML = `<div class="alert alert-error"><i class="fas fa-times-circle"></i> ${err.message}</div>`;
      btn.disabled = false;
      btn.innerHTML = '<i class="fas fa-user-plus"></i> Crear cuenta';
    }
  });
});
</script>
</body>
</html>
